name: Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: docker
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y zsh procps

      - name: Cache mise
        uses: actions/cache@v4
        with:
          path: ~/.local/share/mise/installs
          key: ${{ runner.os }}-mise-${{ hashFiles('.mise.toml', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-mise-

      - name: Install mise
        uses: https://github.com/jdx/mise-action@v2
        with:
          install: false
          github_token: ''

      - name: Install toolchains
        run: mise install
        env:
          GITHUB_TOKEN: ''

      - name: Check Formatting
        run: |
          mise run fmt
          git diff --exit-code

      - name: Build project
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace
