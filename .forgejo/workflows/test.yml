name: Test Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: docker
    steps:
      - name: Checkout repository
        uses: https://github.com/actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      - name: Install mise and toolchains
        uses: https://github.com/jdx/mise-action@v2
        with:
          version: latest
          install: true

      - name: Check Formatting
        run: |
          mise run fmt
          git diff --exit-code

      - name: Build project
        run: cargo build --workspace

      - name: Run tests
        run: cargo test --workspace
