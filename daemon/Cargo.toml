[package]
name = "shbot"
version = "0.1.0"
edition = "2024"

[dependencies]

clap = { version = "4.6.1", features = ["derive"] }
daemonize = "0.5.0"
directories = "6.0.0"
git2 = "0.20.4"
listenfd = "1.0.2"
notify = "8.2.0"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.1", features = ["full"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
